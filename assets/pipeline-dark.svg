<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 172" width="910" height="172" role="img" aria-label="Linea de produccion de datos: Datos, Analisis, Modelo, Despliegue, Decision">
  <style>
    .cap  { font: 600 11px "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 2.2px; fill: #7D8590; }
    .ttl  { font: 700 15px "Segoe UI", Helvetica, Arial, sans-serif; fill: #E6EDF3; }
    .sub  { font: 400 11px "Segoe UI", Helvetica, Arial, sans-serif; fill: #8B949E; }
    .foot { font: 400 12px "Segoe UI", Helvetica, Arial, sans-serif; fill: #8B949E; }
    .box  { fill: #161B22; stroke: #30363D; stroke-width: 1.2; }
    .last { fill: #0C2D6B; stroke: #1F6FEB; stroke-width: 1.4; }
    .lttl { fill: #CAE8FF; }
    .lsub { fill: #79C0FF; }
    .leg  { stroke: #30363D; stroke-width: 1.2; }
    .belt { stroke: #484F58; stroke-width: 2; stroke-linecap: round; }
    .roll { stroke: #484F58; stroke-width: 2; stroke-dasharray: 2 12; stroke-linecap: round; }
    .part { fill: #79C0FF; }

    /* La pieza recorre la linea: 4 tramos de 15% y 5 paradas de 8% = 100% de 11s */
    @keyframes travel {
      0%   { transform: translateX(0px);   opacity: 0; }
      3%   { opacity: 1; }
      8%   { transform: translateX(0px); }
      23%  { transform: translateX(182px); }
      31%  { transform: translateX(182px); }
      46%  { transform: translateX(364px); }
      54%  { transform: translateX(364px); }
      69%  { transform: translateX(546px); }
      77%  { transform: translateX(546px); }
      92%  { transform: translateX(728px); }
      96%  { opacity: 1; }
      100% { transform: translateX(728px); opacity: 0; }
    }
    /* Cada estacion se enciende cuando la pieza llega: retardo negativo por estacion */
    @keyframes pulse {
      0%       { fill: #161B22; stroke: #30363D; }
      1%,  8%  { fill: #0C2D6B; stroke: #1F6FEB; }
      14%,100% { fill: #161B22; stroke: #30363D; }
    }
    @keyframes arrive {
      0%,  90% { stroke-width: 1.4; }
      93%, 98% { stroke-width: 3.2; }
      100%     { stroke-width: 1.4; }
    }
    @keyframes roll { to { stroke-dashoffset: -14; } }

    .part { animation: travel 11s cubic-bezier(.45,.05,.35,1) infinite; }
    .roll { animation: roll 1.1s linear infinite; }
    .s1   { animation: pulse 11s linear infinite; }
    .s2   { animation: pulse 11s linear infinite -8.47s; }
    .s3   { animation: pulse 11s linear infinite -5.94s; }
    .s4   { animation: pulse 11s linear infinite -3.41s; }
    .s5   { animation: arrive 11s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .part, .roll, .s1, .s2, .s3, .s4, .s5 { animation: none; }
      .part { opacity: 1; }
    }
  </style>

  <text class="cap" x="16" y="20">LÍNEA DE PRODUCCIÓN DE DATOS</text>

  <g>
    <rect class="box s1" x="16"  y="36" width="150" height="68" rx="10"/>
    <text class="ttl" x="91"  y="68" text-anchor="middle">Datos</text>
    <text class="sub" x="91"  y="88" text-anchor="middle">SQL · Pandas</text>

    <rect class="box s2" x="198" y="36" width="150" height="68" rx="10"/>
    <text class="ttl" x="273" y="68" text-anchor="middle">Análisis</text>
    <text class="sub" x="273" y="88" text-anchor="middle">EDA · Features</text>

    <rect class="box s3" x="380" y="36" width="150" height="68" rx="10"/>
    <text class="ttl" x="455" y="68" text-anchor="middle">Modelo</text>
    <text class="sub" x="455" y="88" text-anchor="middle">scikit-learn</text>

    <rect class="box s4" x="562" y="36" width="150" height="68" rx="10"/>
    <text class="ttl" x="637" y="68" text-anchor="middle">Despliegue</text>
    <text class="sub" x="637" y="88" text-anchor="middle">FastAPI · Vercel</text>

    <rect class="last s5" x="744" y="36" width="150" height="68" rx="10"/>
    <text class="ttl lttl" x="819" y="68" text-anchor="middle">Decisión</text>
    <text class="sub lsub" x="819" y="88" text-anchor="middle">Panel · API · Power BI</text>
  </g>

  <g class="leg">
    <path d="M91 104 V118"/><path d="M273 104 V118"/><path d="M455 104 V118"/>
    <path d="M637 104 V118"/><path d="M819 104 V118"/>
  </g>

  <path class="belt" d="M16 126 H894"/>
  <path class="roll" d="M16 126 H894"/>

  <rect class="part" x="82" y="112" width="18" height="14" rx="3"/>

  <text class="foot" x="16" y="154">Ninguno de mis proyectos se queda en el notebook: todos llegan al final de la línea.</text>
</svg>
